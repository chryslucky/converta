name: Converta CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate static app assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate entry pages and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s a.html
          if [[ -d js ]]; then
            mapfile -d '' scripts < <(find js -type f -name '*.js' -print0)
            for script in "${scripts[@]}"; do node --check "$script"; done
          fi
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); if (!p.name || !p.scripts?.build) process.exit(1); console.log('Project manifest validated:', p.name);"
